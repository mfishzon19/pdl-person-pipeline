# Flyway runtime config — local development against Docker Postgres.
#
# Connection details match docker-compose.yml in the repo root and
# processing/dbt/profiles.yml.example. The pdl_etl_dev password is for the
# local Docker Postgres only.
#
# To point at a different database, override via env vars:
#   FLYWAY_URL=jdbc:postgresql://<host>:<port>/<dbname>
#   FLYWAY_USER=<user>
#   FLYWAY_PASSWORD=<password>
# Flyway picks up FLYWAY_* env vars automatically and they override
# values in this file.

flyway.url=jdbc:postgresql://localhost:5432/pdl_etl
flyway.user=pdl_etl
flyway.password=pdl_etl_dev

# Where the Vn__*.sql migrations live, relative to repo root when
# invoked via `flyway -configFiles=modeling/flyway/flyway.conf migrate`.
flyway.locations=filesystem:./modeling/flyway/migrations

# Schemas Flyway is permitted to manage. The first one is the default
# schema and is where Flyway creates its history table
# (flyway_schema_history).
flyway.schemas=catalog,raw,pdl_api,ref,integration,staging
flyway.defaultSchema=catalog

# If invoked against an existing non-empty database, Flyway treats the
# current state as the baseline (V0) before applying our migrations.
# Useful for retrofitting; harmless on a fresh DB.
flyway.baselineOnMigrate=true

# Sanity: refuse to run if the latest migration has already been
# applied with a different checksum (someone hand-edited V1 after it
# was applied). Forces clean replay (`make dev-reset`) or explicit
# `flyway repair`.
flyway.validateOnMigrate=true
